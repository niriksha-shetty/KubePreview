apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
  namespace: pr-__PR_NUMBER__
  labels:
    app: sample-app
    managed-by: kubepreview
    pr-number: "__PR_NUMBER__"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample-app
  template:
    metadata:
      labels:
        app: sample-app
        pr-number: "__PR_NUMBER__"
    spec:
      containers:
      - name: sample-app
        image: kubepreview-sample-app:__IMAGE_TAG__
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: PR_NUMBER
          value: "__PR_NUMBER__"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: DB_HOST
          value: "postgres"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: "kubepreview_db"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "postgres_password"
        resources:
          requests:
            cpu: "100m"
            memory: "100Mi"
          limits:
            cpu: "200m"
            memory: "200Mi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 3
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: sample-app-service
  namespace: pr-__PR_NUMBER__
  labels:
    app: sample-app
    managed-by: kubepreview
    pr-number: "__PR_NUMBER__"
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  selector:
    app: sample-app
